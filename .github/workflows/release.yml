name: Release

# Builds installers for every platform and attaches them to a draft GitHub
# Release when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
# Publish the draft by hand after checking the assets; `latest.json` for the
# auto-updater is uploaded alongside them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One at a time. Every job writes the same `latest.json` to the same
      # draft release, and tauri-action deletes the existing asset before
      # uploading its own. Two jobs finishing together race on that delete and
      # the loser fails with "Not Found" (seen on v0.2.2: the Intel macOS job
      # died after uploading its dmg, so `latest.json` had no darwin-x86_64
      # entry and the version-free copy was never made). A release takes four
      # times as long this way and is worth it.
      max-parallel: 1
      matrix:
        include:
          # Both macOS builds run on the Apple Silicon runner; the Intel one
          # is a cross-compile (GitHub retired the macos-13 Intel runners).
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    # Only version tags produce releases; a manual run on a branch would create a
    # mis-named draft.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Tag `v0.2.0` → VERSION=0.2.0, used to build the download links above.
      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Utilify ${{ github.ref_name }}"
          releaseBody: |
            ## Download

            | Platform | Download |
            | --- | --- |
            | Windows | [Utilify_${{ env.VERSION }}_x64-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Utilify_${{ env.VERSION }}_x64-setup.exe) |
            | macOS, Apple Silicon (M1 or newer) | [Utilify_${{ env.VERSION }}_aarch64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Utilify_${{ env.VERSION }}_aarch64.dmg) |
            | macOS, Intel | [Utilify_${{ env.VERSION }}_x64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Utilify_${{ env.VERSION }}_x64.dmg) |
            | Linux | [Utilify_${{ env.VERSION }}_amd64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Utilify_${{ env.VERSION }}_amd64.AppImage) or [Utilify_${{ env.VERSION }}_amd64.deb](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Utilify_${{ env.VERSION }}_amd64.deb) |

            Ignore the rest: `.sig`, `.app.tar.gz` and `latest.json` belong to the in-app updater, and "Source code" is added by GitHub.

            Utilify is tested on Windows only. The macOS and Linux builds are published but untested; please open an issue if something breaks.

            The installers are not signed with a paid certificate, so Windows SmartScreen and macOS Gatekeeper warn on first launch (Windows: More info → Run anyway; macOS: right-click → Open).

            First launch walks you through creating your own free Spotify app (about 2 minutes). Spotify Premium is required.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Version-free copies so `releases/latest/download/<name>` links in the
      # README always point at the newest release.
      - name: Upload stable-name copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p stable
          # tr strips the CR that Windows runners append to each line.
          echo "$ARTIFACTS" | jq -r '.[]' | tr -d '\r' | while read -r f; do
            f="${f//\\//}"
            case "$(basename "$f")" in
              *-setup.exe)    cp "$f" stable/Utilify-windows-x64-setup.exe ;;
              *_aarch64.dmg)  cp "$f" stable/Utilify-macos-apple-silicon.dmg ;;
              *_x64.dmg)      cp "$f" stable/Utilify-macos-intel.dmg ;;
              *.AppImage)     cp "$f" stable/Utilify-linux-x86_64.AppImage ;;
              *.deb)          cp "$f" stable/Utilify-linux-amd64.deb ;;
            esac
          done
          ls -la stable
          if [ -n "$(ls -A stable)" ]; then
            gh release upload "$GITHUB_REF_NAME" stable/* --clobber
          fi
