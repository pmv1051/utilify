name: Release

# Builds installers for every platform and attaches them to a draft GitHub
# Release when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
# Publish the draft by hand after checking the assets; `latest.json` for the
# auto-updater is uploaded alongside them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS builds run on the Apple Silicon runner; the Intel one
          # is a cross-compile (GitHub retired the macos-13 Intel runners).
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Utilify ${{ github.ref_name }}"
          releaseBody: |
            ## Download

            | Platform | File |
            | --- | --- |
            | Windows | `Utilify_…_x64-setup.exe` |
            | macOS, Apple Silicon (M1 or newer) | `Utilify_…_aarch64.dmg` |
            | macOS, Intel | `Utilify_…_x64.dmg` |
            | Linux | `Utilify_…_amd64.AppImage` (any distro) or `.deb` (Debian/Ubuntu) |

            Ignore the rest: `.sig`, `.app.tar.gz` and `latest.json` belong to the in-app updater, and "Source code" is added by GitHub.

            The installers are not signed with a paid certificate, so Windows SmartScreen and macOS Gatekeeper warn on first launch (Windows: More info → Run anyway; macOS: right-click → Open).

            First launch walks you through creating your own free Spotify app (about 2 minutes). Spotify Premium is required.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
